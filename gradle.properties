# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.2
loader_version=0.19.4
# Minimum Fabric Loader version *required at runtime* (fabric.mod.json), kept separate from
# loader_version above (which is just what we compile/test against in dev). Set to what
# fabric-api actually declares as its own minimum (verified from fabric-api's own
# fabric.mod.json) rather than the newer dev-time loader version -- otherwise players on an
# older-but-still-compatible loader get told to upgrade for no real reason.
loader_version_min=0.18.4
kotlin_loader_version=1.13.13+kotlin.2.4.10
# Mod Properties
mod_version=1.0-SNAPSHOT
maven_group=opal.dev
archives_base_name=wynnoverhaul
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.158.0+26.2
# Optional ModMenu integration (see WynnOverhaulModMenu.kt); check https://modrinth.com/mod/modmenu
modmenu_version=20.0.1
# Optional Voxy integration (see VoxyVista.kt); check https://modrinth.com/mod/voxy
voxy_version=0.2.19-beta
