states:
  - name: walk
    toggle: locomotionWalk
    vars:
      wSprintG: "wSprint * grounded"
      wWalk: "wMove * grounded * (1 - wSprint)"
      armMul: "(style.walkArm - 1) * wWalk + (style.sprintArm - 1) * wSprintG"
      legMul: "(style.walkLeg - 1) * wWalk + (style.sprintLeg - 1) * wSprintG"
      gr: "grounded * (1 - wCrouch)"
      bank: "turnRate * (wWalk + wSprintG) * grounded"
      idle: "gr * (1 - wMove)"
      bob: "style.walkBob * wWalk + style.sprintBob * wSprintG"
      sway: "style.walkSway * wWalk + style.sprintSway * wSprintG"
      leanAmt: "style.walkLean * wWalk + style.sprintLean * wSprintG"
      stride: "pow(1 - abs(gait), style.bobSharp)"
      footfall: "abs(gait) * abs(gait) * abs(gait)"
      breath: "sin(age * style.idleRate * 6.2832)"
    effects:
      - {to: rightLeg.x, add: "gait * 1.4 * (sp * legMul + boost) * k"}
      - {to: leftLeg.x, add: "gaitOpp * 1.4 * (sp * legMul + boost) * k"}
      - {to: rightLeg.z, add: "style.swagger * sp * gr * k"}
      - {to: leftLeg.z, sub: "style.swagger * sp * gr * k"}
      - {to: torso.roll, sub: "bank * 0.1 * k"}
      - {to: torso.yaw, add: "bank * 0.08 * k"}
      - {to: torso.pitch, add: "slopePitch * (wWalk + wSprintG) * k"}
      - {to: rightArm.x, add: "gaitOpp * (sp * armMul + boost) * k", freeArms: true}
      - {to: leftArm.x, add: "gait * (sp * armMul + boost) * k", freeArms: true}
      - {to: rightArm.z, add: "style.armFlare * sp * gr * k", freeArms: true}
      - {to: leftArm.z, sub: "style.armFlare * sp * gr * k", freeArms: true}
      - {to: torso.shift, add: "-stride * sp * bob * k + style.walkDrop * wWalk * k + footfall * sp * style.stomp * (wWalk + 1.5 * wSprintG) * k", freeArms: true}
      - {to: torso.pitch, add: "footfall * sp * style.stomp * 0.03 * (wWalk + wSprintG) * k", freeArms: true}
      - {to: torso.yaw, add: "sin(phase) * sp * sway * k", freeArms: true}
      - {to: torso.roll, add: "gait * sp * style.roll * gr * k", freeArms: true}
      - {to: torso.pitch, add: "leanAmt * k * clamp(sp * 2, 0, 1)", freeArms: true}
      - {to: head.z, sub: "gait * sp * style.headRoll * gr * k", freeArms: true}
      - {to: head.y, sub: "bank * 0.12 * k", freeArms: true}
      - {to: head.x, add: "sin(phase * 2) * sp * style.headBob * gr * k", freeArms: true}
      - {to: torso.pitch, add: "style.posture * gr * k", freeArms: true}
      - {to: head.x, add: "style.idleHeadDrop * idle * k", freeArms: true}
      - {to: torso.shift, add: "sin(age * style.idleRate * 6.2832) * style.idleBreath * idle * k", freeArms: true}
      - {to: torso.yaw, add: "sin(age * style.idleRate * 2.3) * style.idleSway * idle * k", freeArms: true}
      - {to: torso.roll, add: "sin(age * style.idleRate * 1.7) * style.idleSway * 0.6 * idle * k", freeArms: true}
      - {to: rightArm.z, add: "style.idleArmOpen * idle * k", freeArms: true}
      - {to: leftArm.z, sub: "style.idleArmOpen * idle * k", freeArms: true}
      - {to: rightArm.x, add: "breath * style.idleBreath * 0.4 * idle * k", freeArms: true}
      - {to: leftArm.x, add: "breath * style.idleBreath * 0.4 * idle * k", freeArms: true}

  - name: jump
    toggle: locomotionJump
    effects:
      - {to: rightArm.x, add: "-style.jumpArms * wRise * wAir * k", freeArms: true}
      - {to: leftArm.x, add: "-style.jumpArms * wRise * wAir * k", freeArms: true}
      - {to: rightArm.z, add: "style.fallSpread * wFall * wAir * k", freeArms: true}
      - {to: leftArm.z, sub: "style.fallSpread * wFall * wAir * k", freeArms: true}
      - {to: rightLeg.x, add: "(-style.jumpLegs * wRise + 0.25 * wFall) * wAir * k"}
      - {to: leftLeg.x, add: "(0.4 * style.jumpLegs * wRise + 0.1 * wFall) * wAir * k"}
      - {to: rightLeg.z, add: "style.fallLegs * wFall * wAir * k"}
      - {to: leftLeg.z, sub: "style.fallLegs * wFall * wAir * k"}

  - name: launch
    toggle: locomotionJump
    gate: launch
    vars:
      u: "launchAge / 0.34"
      compress: "clamp(1 - u / 0.4, 0, 1)"
      stretch: "sin(clamp(u / 0.75, 0, 1) * pi)"
      drive: "sin(clamp(u / 0.5, 0, 1) * pi * 0.5) * launch"
      speedLean: "clamp(pace, 0, 1) * 0.1"
      swing: "sin(clamp(u / 0.6, 0, 1) * pi) * style.launchArms"
    effects:
      - {to: torso.shift, add: "compress * compress * style.launchDip * k - stretch * style.launchStretch * k"}
      - {to: torso.pitch, add: "(compress * 0.16 + speedLean * stretch) * k"}
      - {to: rightLeg.x, sub: "drive * 0.9 * k * leadRight"}
      - {to: leftLeg.x, sub: "drive * 0.9 * k * (1 - leadRight)"}
      - {to: rightLeg.x, add: "(stretch * 0.6 + compress * 0.1) * k * (1 - leadRight)"}
      - {to: leftLeg.x, add: "(stretch * 0.6 + compress * 0.1) * k * leadRight"}
      - {to: leftArm.x, sub: "swing * (0.9 * leadRight + 0.6 * (1 - leadRight)) * k", freeArms: true}
      - {to: rightArm.x, sub: "swing * (0.9 * (1 - leadRight) + 0.6 * leadRight) * k", freeArms: true}

  - name: land
    toggle: locomotionJump
    gate: wLand
    effects:
      - {to: torso.shift, add: "style.landDip * wLand * k"}
      - {to: torso.pitch, add: "style.landLean * wLand * k"}
      - {to: rightLeg.x, sub: "0.5 * wLand * k"}
      - {to: leftLeg.x, sub: "0.5 * wLand * k"}
      - {to: rightArm.z, add: "0.35 * wLand * k", freeArms: true}
      - {to: leftArm.z, sub: "0.35 * wLand * k", freeArms: true}

  - name: crouch
    toggle: locomotionCrouch
    gate: wCrouch
    effects:
      - {to: torso.pitch, add: "style.crouchLean * 0.25 * wCrouch * k"}
      - {to: rightArm.x, sub: "style.crouchArm * 0.4 * wCrouch * k", freeArms: true}
      - {to: leftArm.x, sub: "style.crouchArm * 0.4 * wCrouch * k", freeArms: true}
      - {to: rightArm.z, sub: "0.1 * style.crouchArm * wCrouch * k", freeArms: true}
      - {to: leftArm.z, add: "0.1 * style.crouchArm * wCrouch * k", freeArms: true}
      - {to: rightLeg.x, sub: "style.crouchLeg * wCrouch * k * (0.6 + 0.4 * gait * sp)"}
      - {to: leftLeg.x, sub: "style.crouchLeg * wCrouch * k * (0.6 - 0.4 * gait * sp)"}
      - {to: head.x, add: "0.1 * wCrouch * k"}

  - name: swim
    toggle: locomotionSwim
    vars:
      swim: "wSwim * (1 - wCrawl)"
      tread: "wTread * (1 - wCrawl)"
      rate: "0.75 + 0.45 * clamp(pace, 0, 1.3)"
      beat: "age * 0.9 * rate"
      kickAmp: "style.swimKick * (0.55 + 0.45 * clamp(pace * 2, 0, 1))"
      stroke: "sin(age * 0.45 * rate)"
    effects:
      - {to: rightLeg.x, add: "sin(beat) * kickAmp * swim * k + sin(beat * 0.6) * 0.45 * tread * k"}
      - {to: leftLeg.x, add: "sin(beat + pi) * kickAmp * swim * k - sin(beat * 0.6) * 0.45 * tread * k"}
      - {to: rightLeg.x, add: "sin(beat * 0.5) * 0.18 * wCrawl * k"}
      - {to: leftLeg.x, add: "sin(beat * 0.5 + pi) * 0.18 * wCrawl * k"}
      - {to: rightArm.x, add: "sin(beat + pi) * 0.9 * style.swimArm * swim * k", freeArms: true}
      - {to: leftArm.x, add: "sin(beat) * 0.9 * style.swimArm * swim * k", freeArms: true}
      - {to: rightArm.z, add: "(stroke * style.swimArm * 0.25 * swim + (0.55 + 0.25 * stroke) * tread) * k", freeArms: true}
      - {to: leftArm.z, sub: "(stroke * style.swimArm * 0.25 * swim + (0.55 - 0.25 * stroke) * tread) * k", freeArms: true}
      - {to: rightArm.x, add: "-0.9 * wCrawl * k", freeArms: true}
      - {to: leftArm.x, add: "-0.9 * wCrawl * k", freeArms: true}
      - {to: rightArm.z, add: "0.15 * wCrawl * k", freeArms: true}
      - {to: leftArm.z, sub: "0.15 * wCrawl * k", freeArms: true}

  - name: climb
    toggle: locomotionClimb
    gate: wClimb
    vars:
      ph: "age * 0.4"
      pull: "wClimb * min(k, 1)"
    effects:
      - {to: rightArm.x, approach: "-1.9 + sin(ph) * style.climbArm * climbMove", rate: "pull", freeArms: true}
      - {to: leftArm.x, approach: "-1.9 - sin(ph) * style.climbArm * climbMove", rate: "pull", freeArms: true}
      - {to: rightArm.z, add: "0.15 * wClimb * k", freeArms: true}
      - {to: leftArm.z, sub: "0.15 * wClimb * k", freeArms: true}
      - {to: rightLeg.x, add: "(-0.35 - sin(ph + pi) * style.climbLeg * climbMove) * wClimb * k"}
      - {to: leftLeg.x, add: "(-0.35 - sin(ph) * style.climbLeg * climbMove) * wClimb * k"}
      - {to: torso.pitch, add: "0.08 * wClimb * k"}

  - name: ride
    toggle: locomotionRide
    gate: wRide
    effects:
      - {to: rightLeg.z, add: "style.rideSpread * wRide * k"}
      - {to: leftLeg.z, sub: "style.rideSpread * wRide * k"}
      - {to: rightArm.x, sub: "style.rideArm * wRide * k", freeArms: true}
      - {to: leftArm.x, sub: "style.rideArm * wRide * k", freeArms: true}
      - {to: rightArm.z, add: "0.1 * wRide * k", freeArms: true}
      - {to: leftArm.z, sub: "0.1 * wRide * k", freeArms: true}
      - {to: torso.pitch, add: "style.rideLean * wRide * k"}

  - name: elytra
    toggle: locomotionElytra
    gate: wFly
    effects:
      - {to: rightArm.x, add: "style.elytraArm * wFly * k", freeArms: true}
      - {to: leftArm.x, add: "style.elytraArm * wFly * k", freeArms: true}
      - {to: rightArm.z, add: "0.12 * wFly * k", freeArms: true}
      - {to: leftArm.z, sub: "0.12 * wFly * k", freeArms: true}
      - {to: rightLeg.x, add: "style.elytraLeg * wFly * k"}
      - {to: leftLeg.x, add: "style.elytraLeg * wFly * k"}
      - {to: rightLeg.z, sub: "0.08 * wFly * k"}
      - {to: leftLeg.z, add: "0.08 * wFly * k"}

  - name: eat
    toggle: locomotionUseItem
    gate: wUse
    vars:
      chew: "sin(age * 1.6) * style.useChew * wUse * k"
    effects:
      - {to: head.x, add: "chew"}
      - {to: head.posY, add: "chew * 0.5"}

  - name: block
    toggle: locomotionUseItem
    gate: wBlock
    effects:
      - {to: torso.pitch, add: "-style.useBrace * wBlock * k"}
      - {to: rightLeg.x, sub: "0.15 * wBlock * k"}
      - {to: leftLeg.x, add: "0.25 * wBlock * k"}

  - name: hurt
    toggle: locomotionHurt
    gate: wHurt
    effects:
      - {to: torso.pitch, add: "-style.hurtRecoil * wHurt * k"}
      - {to: head.x, sub: "0.25 * wHurt * k"}
      - {to: rightArm.z, add: "style.hurtFlail * wHurt * k", freeArms: true}
      - {to: leftArm.z, sub: "style.hurtFlail * wHurt * k", freeArms: true}

  - name: death
    toggle: locomotionDeath
    gate: wDead
    effects:
      - {to: rightArm.z, add: "style.deathFlop * wDead * k", freeArms: true}
      - {to: leftArm.z, sub: "style.deathFlop * wDead * k", freeArms: true}
      - {to: rightArm.x, approach: "-0.3", rate: "wDead * 0.5", freeArms: true}
      - {to: leftArm.x, approach: "-0.3", rate: "wDead * 0.5", freeArms: true}
      - {to: rightLeg.z, add: "0.3 * wDead * k"}
      - {to: leftLeg.z, sub: "0.3 * wDead * k"}
